<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>P2P Tic-Tac-Toe</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --cell: #334155;
    --cell-hover: #475569;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --x: #38bdf8;
    --o: #f472b6;
    --win: #22c55e;
    --accent: #6366f1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at top, #1e293b, var(--bg));
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    text-align: center;
  }
  h1 { font-size: 1.6rem; margin-bottom: 14px; letter-spacing: .5px; }
  .conn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: .85rem;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(148,163,184,.12);
    color: var(--muted);
    margin-bottom: 16px;
  }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #eab308; }
  .conn.connected .dot { background: var(--win); }
  .conn.disconnected .dot { background: #ef4444; }
  .conn.waiting .dot { background: #eab308; animation: pulse 1.2s infinite; }
  @keyframes pulse { 50% { opacity: .3; } }

  button {
    font: inherit;
    cursor: pointer;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    background: var(--accent);
    color: #fff;
    font-weight: 600;
    transition: transform .1s, filter .15s;
  }
  button:hover:not(:disabled) { filter: brightness(1.15); }
  button:active:not(:disabled) { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.secondary { background: var(--cell); }

  #setup { margin-bottom: 16px; }
  .link-box {
    display: none;
    margin-top: 12px;
    gap: 8px;
  }
  .link-box.show { display: flex; }
  .link-box input {
    flex: 1;
    min-width: 0;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid var(--cell);
    background: var(--bg);
    color: var(--text);
    font-size: .8rem;
  }

  #status {
    font-size: 1.15rem;
    font-weight: 600;
    min-height: 1.6em;
    margin-bottom: 16px;
  }
  #status.win { color: var(--win); }
  #status.lose { color: #ef4444; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin: 0 auto 18px;
    aspect-ratio: 1;
  }
  .cell {
    aspect-ratio: 1;
    background: var(--cell);
    border: none;
    border-radius: 14px;
    font-size: clamp(2.2rem, 12vw, 3.6rem);
    font-weight: 800;
    padding: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: default;
    transition: background .15s, transform .15s;
  }
  .cell.x { color: var(--x); text-shadow: 0 0 14px rgba(56,189,248,.5); }
  .cell.o { color: var(--o); text-shadow: 0 0 14px rgba(244,114,182,.5); }
  .cell.playable { cursor: pointer; }
  .cell.playable:hover { background: var(--cell-hover); transform: scale(1.05); }
  .cell.winner {
    background: rgba(34,197,94,.25);
    box-shadow: inset 0 0 0 3px var(--win);
    animation: pop .5s ease;
  }
  @keyframes pop { 50% { transform: scale(1.1); } }
  .cell.mark { animation: drop .2s ease; }
  @keyframes drop { from { transform: scale(.4); opacity: 0; } }

  .you { font-size: .85rem; color: var(--muted); margin-bottom: 8px; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="app">
  <h1>Tic-Tac-Toe</h1>
  <div id="conn" class="conn waiting"><span class="dot"></span><span id="connText">Connecting...</span></div>

  <div id="setup">
    <button id="createBtn" disabled>Create Room</button>
    <div id="linkBox" class="link-box">
      <input id="linkInput" type="text" readonly>
      <button id="copyBtn" class="secondary">Copy</button>
    </div>
  </div>

  <div id="you" class="you"></div>
  <div id="status">Connecting...</div>
  <div id="board" class="board"></div>
  <button id="restartBtn" disabled>Restart Game</button>
</div>

<script>
(() => {
  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  const $ = id => document.getElementById(id);
  const connEl = $('conn'), connText = $('connText'), statusEl = $('status');
  const boardEl = $('board'), createBtn = $('createBtn'), restartBtn = $('restartBtn');
  const linkBox = $('linkBox'), linkInput = $('linkInput'), copyBtn = $('copyBtn');
  const setupEl = $('setup'), youEl = $('you');

  let peer = null, conn = null;
  let myMark = null;           // 'X' or 'O'
  let board = Array(9).fill(null);
  let turn = 'X';
  let gameOver = false;
  let winLine = null;
  let connected = false;
  let winner = null;           // 'X' | 'O' | 'draw' | null

  const roomParam = new URLSearchParams(window.location.search).get('room');
  const isJoiner = !!roomParam;

  // ---------- Board DOM ----------
  const cells = [];
  for (let i = 0; i < 9; i++) {
    const c = document.createElement('button');
    c.className = 'cell';
    c.addEventListener('click', () => onCellClick(i));
    boardEl.appendChild(c);
    cells.push(c);
  }

  // ---------- Rendering ----------
  function setConn(state, text) {
    connEl.className = 'conn ' + state;
    connText.textContent = text;
  }

  function render() {
    cells.forEach((c, i) => {
      const v = board[i];
      c.textContent = v || '';
      c.classList.toggle('x', v === 'X');
      c.classList.toggle('o', v === 'O');
      c.classList.toggle('winner', !!winLine && winLine.includes(i));
      const playable = connected && !gameOver && turn === myMark && !v;
      c.classList.toggle('playable', playable);
      c.disabled = !playable;
    });

    restartBtn.disabled = !connected;

    statusEl.className = '';
    if (!myMark) {
      // not yet set up
    }
    if (!connected) {
      if (gameOver || winner) { /* keep result */ }
    }
    if (winner === 'draw') {
      statusEl.textContent = 'Game Ended in a Draw!';
    } else if (winner) {
      const won = winner === myMark;
      statusEl.textContent = won ? 'You Won! 🎉' : 'You Lost!';
      statusEl.className = won ? 'win' : 'lose';
    } else if (!connected) {
      // status managed by connection handlers
    } else if (turn === myMark) {
      statusEl.textContent = `Your Turn (${myMark})`;
    } else {
      statusEl.textContent = `Waiting for Friend's Turn (${turn})`;
    }
  }

  // ---------- Game logic ----------
  function checkResult() {
    for (const line of WINS) {
      const [a,b,c] = line;
      if (board[a] && board[a] === board[b] && board[a] === board[c]) {
        winner = board[a];
        winLine = line;
        gameOver = true;
        return;
      }
    }
    if (board.every(Boolean)) {
      winner = 'draw';
      gameOver = true;
    }
  }

  function applyMove(index, mark) {
    if (gameOver || board[index] || turn !== mark) return false;
    board[index] = mark;
    cells[index].classList.add('mark');
    setTimeout(() => cells[index].classList.remove('mark'), 250);
    checkResult();
    if (!gameOver) turn = mark === 'X' ? 'O' : 'X';
    render();
    return true;
  }

  function resetGame() {
    board = Array(9).fill(null);
    turn = 'X';
    gameOver = false;
    winLine = null;
    winner = null;
    render();
  }

  function onCellClick(i) {
    if (!connected || gameOver || turn !== myMark || board[i]) return;
    if (applyMove(i, myMark)) {
      send({ type: 'MOVE', index: i });
    }
  }

  restartBtn.addEventListener('click', () => {
    if (!connected) return;
    resetGame();
    send({ type: 'RESTART' });
  });

  // ---------- Networking ----------
  function send(data) {
    if (conn && conn.open) conn.send(data);
  }

  function onData(data) {
    if (!data || typeof data !== 'object') return;
    if (data.type === 'MOVE') {
      const idx = data.index;
      const theirMark = myMark === 'X' ? 'O' : 'X';
      if (Number.isInteger(idx) && idx >= 0 && idx < 9) {
        applyMove(idx, theirMark);
      }
    } else if (data.type === 'RESTART') {
      resetGame();
    }
  }

  function setupConn(c) {
    conn = c;

    c.on('open', () => {
      connected = true;
      setConn('connected', 'Connected! Game Started');
      setupEl.classList.add('hidden');
      resetGame();
    });

    c.on('data', onData);

    const onGone = () => {
      if (!connected && !conn) return;
      connected = false;
      setConn('disconnected', 'Peer Disconnected');
      if (!winner) statusEl.textContent = 'Peer Disconnected';
      statusEl.className = 'lose';
      render();
    };
    c.on('close', onGone);
    c.on('error', err => {
      console.error(err);
      onGone();
    });
  }

  function buildLink(id) {
    const url = new URL(window.location.href);
    url.search = '';
    url.hash = '';
    url.searchParams.set('room', id);
    return url.toString();
  }

  function init() {
    myMark = isJoiner ? 'O' : 'X';
    youEl.textContent = `You are playing as ${myMark}`;
    statusEl.textContent = 'Connecting...';
    setConn('waiting', 'Connecting...');
    render();

    peer = new Peer();

    peer.on('open', id => {
      if (isJoiner) {
        setupEl.classList.add('hidden');
        setConn('waiting', 'Connecting...');
        statusEl.textContent = 'Connecting...';
        const c = peer.connect(roomParam, { reliable: true });
        setupConn(c);
        // Timeout if host unreachable
        setTimeout(() => {
          if (!connected) {
            setConn('disconnected', 'Peer Disconnected');
            statusEl.textContent = 'Could not reach host. Check the link.';
          }
        }, 15000);
      } else {
        createBtn.disabled = false;
        setConn('waiting', 'Ready — create a room');
        statusEl.textContent = 'Create a room to start';
      }
    });

    // Host: accept incoming connection
    peer.on('connection', c => {
      if (isJoiner) return;
      if (conn && conn.open) { c.close(); return; } // only 2 players
      setupConn(c);
    });

    peer.on('disconnected', () => {
      if (!connected && !conn) return;
    });

    peer.on('error', err => {
      console.error(err);
      if (!connected) {
        setConn('disconnected', 'Peer Disconnected');
        statusEl.textContent = err.type === 'peer-unavailable'
          ? 'Room not found. The host may have left.'
          : 'Connection error: ' + err.type;
      }
    });
  }

  createBtn.addEventListener('click', () => {
    if (!peer || !peer.id) return;
    const link = buildLink(peer.id);
    linkInput.value = link;
    linkBox.classList.add('show');
    createBtn.classList.add('hidden');
    setConn('waiting', 'Waiting for Friend...');
    statusEl.textContent = 'Share the link with a friend';
  });

  copyBtn.addEventListener('click', async () => {
    try {
      await navigator.clipboard.writeText(linkInput.value);
    } catch {
      linkInput.select();
      document.execCommand('copy');
    }
    copyBtn.textContent = 'Copied!';
    setTimeout(() => copyBtn.textContent = 'Copy', 1500);
  });

  linkInput.addEventListener('focus', () => linkInput.select());

  init();
})();
</script>
</body>
    </html>
